name: Mobile quality
on:
  push:
    branches: [main, develop, qa]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      EXPO_PUBLIC_API_URL: http://localhost:5000
      APP_ENV: development
      EXPO_NO_TELEMETRY: "1"
      CI: "1"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run i18n:audit -- --strict-untranslated
      - run: npm run build
      - uses: actions/upload-artifact@v7
        with:
          name: mobile-android-bundle
          path: dist/
